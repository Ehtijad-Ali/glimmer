<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glimmer Post Stats</title>
<style>
:root{--bg:#0b0f14;--card:#1c2026;--text:#f2f4f7;--muted:#9aa1ab;--line:#262b33;--accent:#a78bfa;--panel:#14171c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;gap:12px;justify-content:center;align-items:center;min-height:100vh;padding:16px}
.phone{width:min(390px,100%);aspect-ratio:9/20;background:var(--bg);border-radius:18px;overflow:hidden;position:relative;flex-shrink:0}
.top{display:flex;align-items:center;padding:28px 16px 10px;gap:14px}
.top svg{width:22px;height:22px}
.top .t{font-weight:600;font-size:16px;flex:1}
.top .t small{display:block;font-size:10px;color:var(--accent);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.top .see{color:var(--accent);font-weight:600;font-size:15px}
.post{display:flex;justify-content:center;padding:4px 0 10px}
.post img{width:42%;height:auto;display:block;transform-origin:50% 90%;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.icons{display:flex;justify-content:space-between;padding:6px 26px 0}
.ic{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;width:40px}
.ic svg{width:21px;height:21px;stroke:var(--text);fill:none;stroke-width:1.8}
.tabs{display:flex;position:relative;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;font-size:13px;color:var(--muted);padding:10px 0 12px;cursor:pointer;transition:color .15s}
.tab.on{color:var(--text);font-weight:600}
.bar{position:absolute;bottom:-1px;height:2px;background:var(--text);width:20%;transition:left .18s ease}
.pane{display:none;padding:18px 16px}
.pane.on{display:block}
h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:14px}
h3 i{width:13px;height:13px;border:1.3px solid var(--text);border-radius:50%;font-style:normal;font-size:9px;display:inline-flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border-radius:10px;padding:12px 14px 14px;min-height:70px}
.card span{font-size:11px;color:var(--muted)}
.card b{display:block;font-size:17px;margin-top:10px}
.row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:20px}
.sec{margin-top:24px}
p.note{font-size:11px;color:var(--muted);line-height:1.45}
/* editor */
.editor{width:340px;background:var(--panel);border-radius:14px;padding:16px;font-size:13px;max-height:calc(100vh - 32px);overflow:auto}
.editor h2{font-size:15px;margin-bottom:4px}
.editor .hint{color:var(--muted);font-size:11px;margin-bottom:12px}
.editor fieldset{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.editor legend{padding:0 6px;color:var(--accent);font-weight:600;font-size:12px}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
.f label{color:#cfd3da;flex:1}
.f input,.f textarea{background:#0b0d11;color:var(--text);border:1px solid #2c323b;border-radius:6px;padding:5px 7px;font:inherit;width:140px}
.f textarea{width:100%;height:60px;resize:vertical}
.f.col{flex-direction:column;align-items:stretch}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button{background:var(--accent);color:#120d22;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:#262b33;color:var(--text)}
body.rec .bar2{display:none}
[contenteditable]{outline:none;border-radius:3px;cursor:text}
[contenteditable]:hover{box-shadow:0 0 0 1px rgba(167,139,250,.5)}
[contenteditable]:focus{box-shadow:0 0 0 1.5px var(--accent);background:rgba(167,139,250,.08)}
body.rec [contenteditable]:hover{box-shadow:none}
.post img{cursor:pointer}
.bar2{width:min(390px,100%);display:flex;flex-wrap:wrap;gap:6px}
.tip{color:var(--muted);font-size:12px;line-height:1.4;width:100%}
body.rec{align-items:center}
@media (max-width:760px){body{flex-direction:column;align-items:center}.editor{width:min(390px,100%);max-height:none}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
    <div class="t"><small data-k="appName"></small><span data-k="title"></span></div>
    <div class="see" data-k="seeAll"></div>
  </div>
  <div class="post"><img id="postImg" alt="Post image"></div>
  <div class="icons">
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span data-k="iLikes"></span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3.3-6.5A8 8 0 0 1 20 12zm0 0v8l-3.5-2"/></svg><span data-k="iComments"></span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 14V9a3 3 0 0 1 3-3h9m-3-3 3 3-3 3M18 10v5a3 3 0 0 1-3 3H6m3 3-3-3 3-3"/></svg><span data-k="iReposts"></span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M3 4h18l-9 16-2-8z M10 12l11-8"/></svg><span data-k="iShares"></span></div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-5-6 5z"/></svg><span data-k="iSaves"></span></div>
  </div>
  <div class="tabs">
    <div class="tab on" data-t="0" data-k="tab1"></div>
    <div class="tab" data-t="1" data-k="tab2"></div>
    <div class="tab" data-t="2" data-k="tab3"></div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="pane on" data-p="0">
    <h3><span data-k="summaryTitle"></span><i>i</i></h3>
    <div class="grid">
      <div class="card"><span data-k="cViewsL"></span><b data-k="cViews"></b></div>
      <div class="card"><span data-k="cViewersL"></span><b data-k="cViewers"></b></div>
      <div class="card"><span data-k="cVisitsL"></span><b data-k="cVisits"></b></div>
      <div class="card"><span data-k="cFollowsL"></span><b data-k="cFollows"></b></div>
    </div>
  </div>
  <div class="pane" data-p="1">
    <h3><span data-k="actionsTitle"></span><i>i</i></h3>
    <div class="row"><span>Follows</span><span data-k="eFollows"></span></div>
    <h3 class="sec"><span data-k="interTitle"></span><i>i</i></h3>
    <div class="row"><span>Likes</span><span data-k="eLikes"></span></div>
    <div class="row"><span>Comments</span><span data-k="eComments"></span></div>
    <div class="row"><span>Reposts</span><span data-k="eReposts"></span></div>
    <div class="row"><span>Shares</span><span data-k="eShares"></span></div>
    <div class="row"><span>Saves</span><span data-k="eSaves"></span></div>
  </div>
  <div class="pane" data-p="2">
    <h3><span data-k="whoTitle"></span><i>i</i></h3>
    <p class="note" data-k="whoText"></p>
    <h3 class="sec"><span data-k="audTitle"></span><i>i</i></h3>
    <p class="note" data-k="audText"></p>
  </div>
</div>

<div class="bar2" id="tools">
  <button id="play">&#9654; Play</button>
  <button class="ghost" id="imgBtn">Image</button>
  <button class="ghost" id="rec">Record</button>
  <button class="ghost" id="reset">Reset</button>
  <input type="file" id="imgFile" accept="image/*" hidden>
  <div class="tip">Tap any text or number on the screen to edit it. Tap the picture to swap it. Esc leaves record mode.</div>
</div>

const KEY="glimmer-stats-v1";
let S;
try{S=Object.assign({},DEFAULTS,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S=Object.assign({},DEFAULTS)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(){
  document.querySelectorAll("[data-k]").forEach(el=>{el.textContent=S[el.dataset.k]});
  document.getElementById("postImg").src=S.img||DEFAULT_IMG;
}
document.querySelectorAll("[data-k]").forEach(el=>{
  if(el.dataset.k==="appName")return;
  el.contentEditable="plaintext-only";el.spellcheck=false;
  el.addEventListener("input",()=>{S[el.dataset.k]=el.textContent;save()});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.blur()}});
  el.addEventListener("click",e=>e.stopPropagation());
});
const fileIn=document.getElementById("imgFile");
document.getElementById("imgBtn").onclick=()=>fileIn.click();
document.getElementById("postImg").onclick=()=>fileIn.click();
fileIn.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.img=r.result;render();save()};r.readAsDataURL(f)};

function setTab(n){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",+t.dataset.t===n));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",+p.dataset.p===n));
  const t=document.querySelectorAll(".tab")[n];
  const bar=document.getElementById("bar");
  bar.style.width=(t.offsetWidth*0.62)+"px";
  bar.style.left=(t.offsetLeft+t.offsetWidth*0.19)+"px";
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{stop();setTab(+t.dataset.t)},true));
let timers=[];
function stop(){timers.forEach(clearTimeout);timers=[]}
function play(){
  stop();setTab(0);
  const a=S.tDelay*1000+S.t1*1000, b=a+S.t2*1000;
  timers.push(setTimeout(()=>setTab(1),a));
  timers.push(setTimeout(()=>setTab(2),b));
  if(S.loop)timers.push(setTimeout(play,b+2500));
}
document.getElementById("play").onclick=play;
document.getElementById("rec").onclick=()=>{document.body.classList.add("rec");setTimeout(play,800)};
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("rec")});
document.getElementById("reset").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){};location.reload()};
window.addEventListener("resize",()=>setTab([...document.querySelectorAll(".tab")].findIndex(t=>t.classList.contains("on"))));
render();setTab(0);
</script>
